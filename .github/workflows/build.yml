# Builds to try the app on each platform: run from the Actions tab, or let a
# push to main run them, and download the artifact for yours.
name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
            bin: cold-drive
          - os: macos-latest
            name: macos-arm64
            bin: cold-drive
          - os: windows-latest
            name: windows-x86_64
            bin: cold-drive.exe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
      - name: Test
        run: cargo test --release
        env:
          ICED_TEST_BACKEND: tiny-skia
      - name: Keep the binary
        uses: actions/upload-artifact@v4
        with:
          name: cold-drive-${{ matrix.name }}
          path: target/release/${{ matrix.bin }}
          if-no-files-found: error

  publish:
    name: Latest build
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Name the binaries after their platform
        run: |
          mkdir -p latest
          cp artifacts/cold-drive-linux-x86_64/cold-drive latest/cold-drive-linux-x86_64
          cp artifacts/cold-drive-macos-arm64/cold-drive latest/cold-drive-macos-arm64
          cp artifacts/cold-drive-windows-x86_64/cold-drive.exe latest/cold-drive-windows-x86_64.exe
          ls -l latest
      # The `latest` tag follows main, so the release's download links
      # stay the same while what they fetch is the newest build.
      - name: Move the latest tag here
        run: |
          git tag -f latest
          git push -f origin latest
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          prerelease: true
          body: |
            Built from `main` at ${{ github.sha }} by the Build workflow.
            Pick the binary for your platform; see the README for the Proton Drive CLI it needs.
          files: latest/*
