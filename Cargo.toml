[package]
name = "cold-pass"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT OR Apache-2.0"
description = "A GNOME-style Proton Drive browser, built on the proton-drive CLI"

[dependencies]
# Same pinned iced revision as libadwaita_iced, so both share every type.
iced = { git = "https://github.com/iced-rs/iced", rev = "84f785b06ac02a49901e4113451fedd31c9c3326", features = ["advanced", "svg", "image", "tokio"] }
libadwaita_iced = { git = "https://gitlab.com/juxuanu/libadwaita-iced", rev = "63d846594ed80f7f0552f634a1ff35d77e2f32a2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "fs", "rt", "macros", "time"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.dev.package."*"]
opt-level = 2
